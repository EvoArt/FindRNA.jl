name: TagBot
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tag:
    if: github.event_name == 'workflow_dispatch' || github.event.comment.user.login == 'JuliaTagBot'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        subdir: ['', 'packages/ProfileHMMs']
    steps:
      - uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          subdir: ${{ matrix.subdir }}
